[project]
name = "ship-no-ship"
version = "0.1.0"
description = "Plan, run and report independent AI code reviews that gate pull requests"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joe Harris" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
ship-no-ship = "ship_no_ship.engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ship_no_ship"]

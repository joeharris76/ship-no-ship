[tool.uv]
required-version = ">=0.11.32"

[tool.uv.workspace]
members = ["packages/engine", "packages/service"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
preview = true
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "C90", "PIE", "SIM", "PLW1514"]
ignore = ["E501", "E731", "B905", "PIE810", "SIM102", "SIM105", "SIM108", "UP017"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["ship_no_ship", "ship_no_ship_service"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/**/conftest.py" = ["F401", "F811"]
"tests/**/test_*.py" = ["F401", "F811"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = ["unit: a unit test", "fast: a test that runs in well under a second"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["packages", "tests", "scripts"]

[[tool.ty.overrides]]
include = [
    "packages/engine/src/ship_no_ship/engine/absence.py",
    "packages/engine/src/ship_no_ship/engine/attempts.py",
    "packages/engine/src/ship_no_ship/engine/brief.py",
    "packages/engine/src/ship_no_ship/engine/classifier.py",
    "packages/engine/src/ship_no_ship/engine/cli.py",
    "packages/engine/src/ship_no_ship/engine/commands.py",
    "packages/engine/src/ship_no_ship/engine/dedup.py",
    "packages/engine/src/ship_no_ship/engine/diff.py",
    "packages/engine/src/ship_no_ship/engine/evidence.py",
    "packages/engine/src/ship_no_ship/engine/github.py",
    "packages/engine/src/ship_no_ship/engine/policy.py",
    "packages/engine/src/ship_no_ship/engine/protocol.py",
    "packages/engine/src/ship_no_ship/engine/report.py",
    "packages/engine/src/ship_no_ship/engine/retry.py",
    "packages/engine/src/ship_no_ship/engine/runner.py",
    "packages/engine/src/ship_no_ship/engine/selection.py",
    "packages/engine/src/ship_no_ship/engine/verdict.py",
    "tests/engine/conftest.py",
    "tests/engine/test_absence.py",
    "tests/engine/test_absence_reset_redaction.py",
    "tests/engine/test_attempts.py",
    "tests/engine/test_brief.py",
    "tests/engine/test_classifier.py",
    "tests/engine/test_cli_plan.py",
    "tests/engine/test_commands.py",
    "tests/engine/test_dedup.py",
    "tests/engine/test_evidence.py",
    "tests/engine/test_github.py",
    "tests/engine/test_policy.py",
    "tests/engine/test_protocol.py",
    "tests/engine/test_retry.py",
    "tests/engine/test_rounds.py",
    "tests/engine/test_runner.py",
    "tests/engine/test_selection.py",
    "tests/engine/test_verdict.py",
]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unsupported-operator = "ignore"
invalid-method-override = "ignore"
not-subscriptable = "ignore"
call-non-callable = "ignore"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]
